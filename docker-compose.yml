version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hascape_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  hascape-api:
    build:
      context: ..
      dockerfile: hascape/api.Dockerfile
    container_name: hascape_api
    restart: always
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      PORT: 4201
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - web

  hascape-game:
    build:
      context: ..
      dockerfile: hascape/server.Dockerfile
    container_name: hascape_game
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: 4200
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - web

volumes:
  postgres_data:

networks:
  internal:
    name: hascape_internal
  web:
    external: true